# Release binaries for every platform. Run by .github/workflows/release.yml on tags.
version: 2
project_name: vx
before:
  hooks:
    - go mod tidy
builds:
  - id: vx
    main: ./cmd/vx
    binary: vx
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/TerracodeBA/vx/internal/version.Version={{.Version}} -X github.com/TerracodeBA/vx/internal/version.Commit={{.ShortCommit}} -X github.com/TerracodeBA/vx/internal/version.Date={{.Date}}
  - id: vx-server
    main: ./cmd/vx-server
    binary: vx-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/TerracodeBA/vx/internal/version.Version={{.Version}} -X github.com/TerracodeBA/vx/internal/version.Commit={{.ShortCommit}} -X github.com/TerracodeBA/vx/internal/version.Date={{.Date}}
archives:
  - id: vx
    ids: [vx]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "vx_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
  - id: vx-server
    ids: [vx-server]
    formats: [tar.gz]
    name_template: "vx-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]
