apiVersion: v1
kind: Service
metadata:
  name: {{ include "vx.fullname" . }}
  labels:
    {{- include "vx.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: kubernetes.io/h2c
  selector:
    {{- include "vx.selectorLabels" . | nindent 4 }}
