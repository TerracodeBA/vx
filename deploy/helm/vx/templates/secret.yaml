{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "set database.existingSecret (a Secret with the Postgres URL) or, to try the chart out, database.url" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vx.databaseSecret" . }}
  labels:
    {{- include "vx.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.urlKey }}: {{ .Values.database.url | quote }}
{{- end }}
