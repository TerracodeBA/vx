# Production vx on one server: vx-server, Postgres and Caddy (automatic HTTPS).
# Installed and updated by install.sh / update.sh in this folder; settings in .env:
#   VX_DOMAIN=app.example.com
#   POSTGRES_PASSWORD=<generated>
#   VX_SECRET_KEY=<generated once by install.sh; seals the GitHub App's credentials>
#   VX_SIGNUP=invite|open|closed (optional, default invite)
#   VX_GITHUB_TOKEN=<optional>
#   VX_GITHUB_URL, VX_GITHUB_API_URL=<optional, GitHub Enterprise only>
#   VX_BLOB_URL, VX_BLOB_ACCESS_KEY_ID, VX_BLOB_SECRET_ACCESS_KEY=<optional: objects in a bucket, docs/deploy.md>
#   VX_BACKUP_URL, VX_BACKUP_ACCESS_KEY_ID, VX_BACKUP_SECRET_ACCESS_KEY, VX_BACKUP_KEEP_DAYS=<optional: off-site backups>
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vx
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vx"]
      interval: 2s
      timeout: 3s
      retries: 30

  vx:
    build:
      context: ../..
      args:
        VERSION: ${VX_VERSION:-dev}
        COMMIT: ${VX_COMMIT:-}
    image: vx:production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VX_DATABASE_URL: postgres://vx:${POSTGRES_PASSWORD}@postgres:5432/vx?sslmode=disable
      VX_GITHUB_TOKEN: ${VX_GITHUB_TOKEN:-}
      VX_PUBLIC_URL: https://${VX_DOMAIN}
      VX_SECRET_KEY: ${VX_SECRET_KEY:-}
      VX_SIGNUP: ${VX_SIGNUP:-invite}
      VX_GITHUB_URL: ${VX_GITHUB_URL:-}
      VX_GITHUB_API_URL: ${VX_GITHUB_API_URL:-}
      VX_BLOB_URL: ${VX_BLOB_URL:-}
      VX_BLOB_ACCESS_KEY_ID: ${VX_BLOB_ACCESS_KEY_ID:-}
      VX_BLOB_SECRET_ACCESS_KEY: ${VX_BLOB_SECRET_ACCESS_KEY:-}
      VX_BACKUP_URL: ${VX_BACKUP_URL:-}
      VX_BACKUP_ACCESS_KEY_ID: ${VX_BACKUP_ACCESS_KEY_ID:-}
      VX_BACKUP_SECRET_ACCESS_KEY: ${VX_BACKUP_SECRET_ACCESS_KEY:-}
    volumes:
      - data:/data
    # Not published: only Caddy reaches it.
    expose:
      - "7070"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - vx
    environment:
      VX_DOMAIN: ${VX_DOMAIN:?set VX_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg:
  data:
  caddy_data:
  caddy_config:
