# Rules vx checks on every land and between open efforts (see docs/agents.md).

# Two migrations may not share a number (the 008 clash of 2026-11-24).
[[unique]]
name = "migration"
glob = "internal/store/migrations/*.sql"
key  = '^(\d+)_'

# Two fields of one proto message may not share a number: two efforts that
# both add field 12 to message LandResponse each merge cleanly, and the
# combined file does not compile (or, worse, does).
[[unique]]
name    = "proto-field"
glob    = "proto/**/*.proto"
scope   = '^\s*message\s+(\w+)'
content = '^\s*(?:(?:optional|repeated|required)\s+)?(?:map<[^>]+>|[A-Za-z_][\w.]*)\s+[A-Za-z_]\w*\s*=\s*(\d+)'

# Generated code: never text-merged; regenerate it instead.
[[generated]]
glob    = "gen/**"
command = "buf generate"

[checks]
required = ['test -z "$(gofmt -l cmd internal)"', "go vet ./...", "VX_REQUIRE_DB=1 go test -count=1 ./..."]
