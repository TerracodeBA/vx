name: Bug report
description: Something in vx does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The exact commands you ran and their output. Run with --json if it helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vx version` and `vx-server version`
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options: [Docker Compose, Binaries, Built from source]
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: OS, git host (GitHub, other), logs from `docker compose logs vx`
