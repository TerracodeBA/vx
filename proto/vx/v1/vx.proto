syntax = "proto3";

package vx.v1;

// Hashes are written as text: "b3:" followed by 64 hex characters.
// Times are RFC 3339 strings in UTC.

// ---------- Shared messages ----------

message Principal {
  string ref = 1; // "user:alice" or "agent:alice/claude-backend"
  string handle = 2;
  string kind = 3; // human, agent, service
  string display_name = 4;
  string email = 5;
  string on_behalf_of = 6; // the human an agent acts for
  bool site_admin = 7; // a superadmin: runs this server (people, invites, GitHub App); no role on any repository from it
  string github_login = 8; // set for people who signed in with GitHub
}

message Branch {
  string name = 1;
  string head = 2; // changeset hash
  string git_sha = 3;
  string synced_at = 4;
}

message Repo {
  string name = 1;
  string provider = 2; // github, gitlab, gitea, forgejo, bitbucket, git, none
  string remote = 3;
  string default_branch = 4;
  repeated Branch branches = 5;
  string org = 6; // the organization that owns the repository
  string my_role = 7; // the caller's role: read, write or admin
  bool github_backed = 8; // roles come from GitHub permissions, not vx grants
  string base_url = 9; // the host's web address (GitLab, Gitea, Forgejo, Bitbucket)
  string host = 10; // the host as people call it: GitHub, GitLab, Gitea, Forgejo, Bitbucket, git, vx
  string web_url = 11; // the repository's page on its host, when known
}

message Effort {
  string repo = 1;
  string slug = 2;
  string name = 3;
  string goal = 4;
  string base_branch = 5;
  string base = 6;
  string head = 7;
  int64 version = 8;
  string state = 9;
  string owner = 10;
  int32 open_workspaces = 11;
  string created_at = 12;
  string updated_at = 13;
  // The rebase in progress (running or stopped on a conflict), if any.
  Rebase rebase = 14;
}

message Author {
  string principal = 1;
  string name = 2;
  string email = 3;
  string on_behalf_of = 4;
  string model = 5;
  string session = 6;
}

message Check {
  string name = 1;
  string result = 2; // pass or fail
  int32 passed = 3;
  int32 failed = 4;
  bool ran_by_vx = 5; // vx ran the command; false: reported by the author
  int64 duration_ms = 6;
  string notes = 7; // e.g. "12 of 14 packages from the Go test cache"
}

message Evidence {
  repeated Check checks = 1;
  repeated string new_tests = 2;
  // Commands vx.toml [checks] required that vx did not run for this change
  // (no vx land --run with exactly that command). Filled by the server.
  repeated string not_verified = 3;
  // People who approved the change under a "human" landing policy of
  // vx.toml before it landed. Filled by the server.
  repeated Approval approvals = 4;
}

message Approval {
  string by = 1; // e.g. "user:alice"
  string at = 2; // RFC 3339
  string review = 3; // the review's id
  repeated string paths = 4; // the files under the policy
}

message FileChange {
  string path = 1;
  string op = 2; // add, modify, delete
  string old_hash = 3;
  string new_hash = 4;
  string mode = 5; // file, exec, symlink
  int32 added = 6;
  int32 deleted = 7;
}

message Changeset {
  string hash = 1;
  string change_id = 2;
  repeated string parents = 3;
  string tree = 4;
  string origin = 5; // vx or upstream
  string git_sha = 6;
  Author author = 7;
  string intent = 8;
  repeated string depends_on = 9;
  Evidence evidence = 10;
  string created_at = 11;
  repeated FileChange files = 12;
  string effort = 13; // slug, empty for upstream changesets
  // Set when the server merged the author's snapshot onto newer work: the
  // evidence was gathered on snapshot_tree, not on tree.
  string snapshot_tree = 14;
  bool merged = 15;
  // Problems the server found in the tree when this change landed, such as
  // a Go function declared twice. Stored beside the changeset, not hashed.
  repeated Warning warnings = 16;
  // Set when a rebase of the effort replayed this change onto a newer base:
  // the evidence was gathered before the rebase, on rebased_from's tree.
  bool rebased = 17;
  string rebased_onto = 18; // git commit of the target, or its changeset hash
  string rebased_onto_branch = 19;
  string rebased_from = 20; // the changeset this one replays
  string rebased_by = 21;
  // Who resolved a conflict on this change during the rebase, if one did.
  string resolved_by = 22;
}

message Workspace {
  string id = 1;
  string repo = 2;
  string effort = 3;
  string intent = 4;
  string change_id = 5;
  string base = 6;
  string state = 7;
  string owner = 8;
  string landed_as = 9;
  string created_at = 10;
}

message Conflict {
  string path = 1;
  string kind = 2; // content, add/add, modify/delete, delete/modify, mode, binary, path
  string detail = 3;
  string base = 4;
  string ours = 5;
  string theirs = 6;
}

// Warning is a problem vx noticed in a merged tree that does not stop a land,
// such as two changes that each declare the same Go function in one package.
message Warning {
  string path = 1; // the file or directory concerned, e.g. a Go package directory
  string kind = 2; // duplicate, parse, check, generated, rule, signature, removed, merged-by-declaration
  string detail = 3; // human-readable, e.g. "duplicate func clientIP in internal/httpapi (audit.go, limit.go)"
}

message Object {
  string kind = 1; // blob or tree
  bytes data = 2;
  string hash = 3; // set in responses
}

// ---------- Auth ----------

service AuthService {
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {}
  // CreateAgent creates an agent that acts for the caller and returns its token.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {}
  // ListAgents lists the caller's agents with a summary of their tokens.
  // Only people have agents.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {}
  // ListTokens lists the tokens of the caller or of one of the caller's
  // agents. Secrets are never returned.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse) {}
  // RevokeToken revokes a token of the caller or of one of the caller's
  // agents. Revoking the token the request is made with needs allow_current.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {}
  // CreateToken issues a new token to the caller or to one of the caller's
  // agents. Only people can create tokens: a leaked agent token must not be
  // able to mint replacements that outlive its revocation.
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse) {}
  // CreateLoginCode returns a one-time code that signs the caller in to the
  // web UI (vx ui). It expires after two minutes and works once.
  rpc CreateLoginCode(CreateLoginCodeRequest) returns (CreateLoginCodeResponse) {}
  // GetAgent returns an agent with its path scope, budgets and today's
  // usage. An agent may read its own (agent empty), a person their agents',
  // a superadmin anyone's.
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {}
  // SetAgentScope changes an agent's path scope and budgets. Only the
  // agent's person or a superadmin may; an agent cannot, not even its own.
  rpc SetAgentScope(SetAgentScopeRequest) returns (SetAgentScopeResponse) {}
}

// AgentScope limits the paths an agent may change and how much. Empty
// allow: every path its person may change; deny wins over allow. Budgets of
// 0 mean no limit. A scope never widens the person's repository role.
message AgentScope {
  repeated string allow = 1; // globs, as in vx.toml
  repeated string deny = 2;
  int32 max_lands_per_day = 3; // per UTC day
  int32 max_lines = 4; // changed lines (added plus deleted) per land
  int32 max_files = 5; // changed files per land
  int32 max_workspaces = 6; // open workspaces at once
  string updated_by = 7; // ref; empty: never set
  string updated_at = 8;
}

// AgentInfo is an agent with its scope and how much of its budgets it used.
message AgentInfo {
  Principal agent = 1;
  AgentScope scope = 2;
  bool unlimited = 3; // no scope and no budgets: today's behaviour
  int32 lands_today = 4; // since the start of the UTC day
  int32 lands_left = 5; // -1: no limit
  int32 open_workspaces = 6;
  int32 workspaces_left = 7; // -1: no limit
  string resets_at = 8; // when lands_today starts again from 0
}

message GetAgentRequest {
  // An agent name ("backend") or handle ("alice/backend"). Empty: the caller,
  // which must be an agent.
  string agent = 1;
}

message GetAgentResponse {
  AgentInfo agent = 1;
}

// SetAgentScopeRequest changes the fields that are set; the others keep
// their value. clear removes every limit first.
message SetAgentScopeRequest {
  string agent = 1; // name ("backend") or handle ("alice/backend")
  bool clear = 2;
  bool set_allow = 3; // replace allow with the list below (empty: everything)
  repeated string allow = 4;
  bool set_deny = 5; // replace deny with the list below
  repeated string deny = 6;
  optional int32 max_lands_per_day = 7; // 0: no limit
  optional int32 max_lines = 8;
  optional int32 max_files = 9;
  optional int32 max_workspaces = 10;
}

message SetAgentScopeResponse {
  AgentInfo agent = 1;
}

message CreateLoginCodeRequest {}

message CreateLoginCodeResponse {
  string code = 1;
  string expires_at = 2;
}

// Token describes an API token. The secret itself is only shown once, when
// the token is created.
message Token {
  string id = 1;
  string principal = 2; // ref of the token's owner
  string name = 3;
  string created_at = 4;
  string last_used_at = 5; // empty: never used
  string revoked_at = 6; // empty: active
  bool current = 7; // the token this request was made with
}

message AgentSummary {
  Principal agent = 1;
  int32 active_tokens = 2;
  int32 revoked_tokens = 3;
  string last_used_at = 4; // latest use of any of its tokens; empty: never
  string created_at = 5;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentSummary agents = 1;
}

message ListTokensRequest {
  // An agent name ("backend") or handle ("alice/backend"). Empty: the caller.
  string agent = 1;
}

message ListTokensResponse {
  Principal principal = 1;
  repeated Token tokens = 2;
}

message RevokeTokenRequest {
  string id = 1; // token id, or a unique prefix of at least 8 characters
  bool allow_current = 2; // allow revoking the token this request uses
}

message RevokeTokenResponse {
  Token token = 1;
  bool already_revoked = 2;
}

message CreateTokenRequest {
  // An agent name ("backend") or handle ("alice/backend"). Empty: the caller.
  string agent = 1;
  string name = 2; // a label such as "laptop"; empty: "created by <caller>"
}

message CreateTokenResponse {
  Principal principal = 1; // the token's owner
  Token token = 2;
  string secret = 3; // shown once; only its hash is stored
}

message WhoAmIRequest {}

message WhoAmIResponse {
  Principal principal = 1;
  // For an agent: its path scope, budgets and what is left of them today.
  AgentInfo agent = 2;
}

message CreateAgentRequest {
  string name = 1; // becomes "<caller>/<name>"
  string display_name = 2;
}

message CreateAgentResponse {
  Principal agent = 1;
  string token = 2;
}

// ---------- Objects ----------

service ObjectService {
  rpc MissingObjects(MissingObjectsRequest) returns (MissingObjectsResponse) {}
  rpc PutObjects(PutObjectsRequest) returns (PutObjectsResponse) {}
  rpc GetObjects(GetObjectsRequest) returns (GetObjectsResponse) {}
}

message MissingObjectsRequest {
  repeated string hashes = 1;
  string repo = 2; // required: objects are scoped to repositories; missing = not yet part of this repo
}

message MissingObjectsResponse {
  repeated string missing = 1;
}

message PutObjectsRequest {
  repeated Object objects = 1;
  string repo = 2; // required: the caller needs write access; the objects become part of this repo
}

message PutObjectsResponse {
  repeated string hashes = 1;
}

message GetObjectsRequest {
  repeated string hashes = 1;
  string repo = 2; // required: only objects that are part of a repo the caller can read are served
}

message GetObjectsResponse {
  repeated Object objects = 1;
}

// ---------- Repos ----------

service RepoService {
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse) {}
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse) {}
  rpc ListRepos(ListReposRequest) returns (ListReposResponse) {}
  // SyncBranch imports the latest commits of an upstream branch.
  rpc SyncBranch(SyncBranchRequest) returns (SyncBranchResponse) {}
  // SetRepoHost sets the token of a GitLab, Gitea, Forgejo or Bitbucket
  // repository or makes a new webhook secret for it (admin).
  rpc SetRepoHost(SetRepoHostRequest) returns (SetRepoHostResponse) {}
}

message CreateRepoRequest {
  string name = 1;
  string provider = 2; // github, gitlab, gitea, forgejo, bitbucket, git or none
  string remote = 3; // owner/name for github, group/project for gitlab, owner/repo for gitea and forgejo, workspace/repo for bitbucket, URL or path for git
  string default_branch = 4; // empty: ask the provider, or "main"
  string org = 5; // owning organization; empty: the org named like the repo's owner part, else the caller's personal org
  string base_url = 6; // gitlab, gitea, forgejo, bitbucket: the host's web address; empty: the server's default (gitlab.com, bitbucket.org)
  string token = 7; // gitlab, gitea, forgejo, bitbucket: a token for this repository only, kept sealed; empty: the server's token for the host
}

message CreateRepoResponse {
  Repo repo = 1;
  HostHook hook = 2; // gitlab, gitea, forgejo, bitbucket: how to register the webhook
}

// HostHook is how to register a repository's webhook on its host.
message HostHook {
  string url = 1; // where the host delivers
  string secret = 2; // the repository's webhook secret: only right after it was made
  string secret_source = 3; // repository, server (VX_<HOST>_WEBHOOK_SECRET) or empty (none: deliveries are refused)
}

message SetRepoHostRequest {
  string repo = 1;
  bool set_token = 2; // replace the token with token (empty token: remove it)
  string token = 3;
  bool rotate_webhook_secret = 4; // make a new webhook secret, returned once
}

message SetRepoHostResponse {
  HostHook hook = 1;
}

message GetRepoRequest {
  string name = 1;
}

message GetRepoResponse {
  Repo repo = 1;
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message SyncBranchRequest {
  string repo = 1;
  string branch = 2; // empty: the default branch
}

message SyncBranchResponse {
  Branch branch = 1;
  int32 imported = 2; // commits imported in this call
}

// ---------- Efforts ----------

service EffortService {
  rpc CreateEffort(CreateEffortRequest) returns (CreateEffortResponse) {}
  rpc GetEffort(GetEffortRequest) returns (GetEffortResponse) {}
  rpc ListEfforts(ListEffortsRequest) returns (ListEffortsResponse) {}
  // CloseEffort marks an effort merged or abandoned. vx also marks efforts
  // merged by itself once their target branch contains every change.
  rpc CloseEffort(CloseEffortRequest) returns (CloseEffortResponse) {}
  // ListOverlaps returns the forecast collisions of an effort with the
  // repository's other open efforts.
  rpc ListOverlaps(ListOverlapsRequest) returns (ListOverlapsResponse) {}
  // Log lists the changes landed in an effort, newest first.
  rpc Log(LogRequest) returns (LogResponse) {}
  rpc GetChangeset(GetChangesetRequest) returns (GetChangesetResponse) {}
  // RebaseEffort replays the effort's changes onto the latest head of a
  // branch (default: its base branch). It finishes, or stops on the first
  // change that conflicts.
  rpc RebaseEffort(RebaseEffortRequest) returns (RebaseEffortResponse) {}
  // ContinueRebase records the resolution of the change a rebase stopped on
  // and replays the rest. It may stop again.
  rpc ContinueRebase(ContinueRebaseRequest) returns (ContinueRebaseResponse) {}
  // AbortRebase drops the rebase in progress; the effort stays as it was.
  rpc AbortRebase(AbortRebaseRequest) returns (AbortRebaseResponse) {}
  // GetRebase returns the rebase in progress, or else the latest one.
  rpc GetRebase(GetRebaseRequest) returns (GetRebaseResponse) {}
}

message CreateEffortRequest {
  string repo = 1;
  string name = 2;
  string goal = 3;
  string base_branch = 4; // empty: the repo's default branch
}

message CreateEffortResponse {
  Effort effort = 1;
}

message GetEffortRequest {
  string repo = 1;
  string effort = 2; // slug
}

message GetEffortResponse {
  Effort effort = 1;
  repeated Workspace open_workspaces = 2;
}

message ListEffortsRequest {
  string repo = 1;
  string state = 2; // empty: all
}

message ListEffortsResponse {
  repeated Effort efforts = 1;
}

message LogRequest {
  string repo = 1;
  string effort = 2;
  int32 limit = 3;
  bool include_files = 4;
}

message LogResponse {
  repeated Changeset changesets = 1;
}

message GetChangesetRequest {
  string repo = 1;
  string ref = 2; // hash, hash prefix or change id
}

message GetChangesetResponse {
  Changeset changeset = 1;
}

// ---------- Workspaces ----------

service WorkspaceService {
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (OpenWorkspaceResponse) {}
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {}
  // SetBase records that the working copy was updated to a newer snapshot.
  rpc SetBase(SetBaseRequest) returns (SetBaseResponse) {}
  // Land merges a snapshot into the effort.
  rpc Land(LandRequest) returns (LandResponse) {}
  rpc Abandon(AbandonRequest) returns (AbandonResponse) {}
  // ReportChanges records the files the working copy of an open workspace
  // changed, so vx context can say who works on which files.
  rpc ReportChanges(ReportChangesRequest) returns (ReportChangesResponse) {}
}

message ReportChangesRequest {
  string id = 1; // the workspace
  repeated string paths = 2; // changed files, at most 2000
}

message ReportChangesResponse {}

message OpenWorkspaceRequest {
  string repo = 1;
  string effort = 2;
  string intent = 3;
}

message OpenWorkspaceResponse {
  Workspace workspace = 1;
}

message GetWorkspaceRequest {
  string id = 1;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message SetBaseRequest {
  string id = 1;
  string base = 2;
}

message SetBaseResponse {
  Workspace workspace = 1;
}

message LandRequest {
  string workspace_id = 1;
  string base = 2; // changeset the snapshot was made on
  string tree = 3; // snapshot root tree, objects uploaded first
  string intent = 4; // empty: the workspace intent
  Evidence evidence = 5;
  repeated string depends_on = 6;
  string model = 7;
  string session = 8;
  // Refuse to merge onto newer work: if the effort moved past base, nothing
  // lands and effort_moved is set, so the caller can sync and re-check.
  bool require_up_to_date = 9;
}

message LandResponse {
  bool landed = 1;
  Changeset changeset = 2;
  bool rebased = 3; // the effort had moved and the snapshot was merged onto it
  repeated string auto_merged = 4; // paths changed on both sides that merged cleanly
  repeated Conflict conflicts = 5; // set when landed is false
  string effort_head = 6;
  bool effort_moved = 7; // require_up_to_date was set and the effort had moved
  repeated Warning warnings = 8; // problems found in the landed tree; they never block a land
  repeated Claim overlapping_claims = 9; // active claims of others on files this land changed; they never block a land
  repeated string kept_both = 10; // paths where both sides inserted different lines at the same place and vx kept both
  repeated Overlap overlaps = 11; // this effort's forecast collisions after the land
  repeated string merged_by_decl = 12; // .go paths whose lines conflicted but whose top-level declarations did not; merged declaration by declaration
  // Set when a "human" landing policy of vx.toml applies: the change waits
  // for a person as this pending review; landed is false and the effort
  // head did not move.
  Review review = 13;
  // landed, pending_review, conflicts or effort_moved. Servers before v0.3
  // leave it empty.
  string status = 14;
}

message AbandonRequest {
  string id = 1;
}

message AbandonResponse {
  Workspace workspace = 1;
}

// ---------- Shipping ----------

service ShipService {
  // PlanShipment shows the commits an effort would ship, replayed onto the
  // latest head of the target branch.
  rpc PlanShipment(PlanShipmentRequest) returns (PlanShipmentResponse) {}
  // OpenShipment pushes vx/<effort> and opens or updates the pull request.
  // With split, it pushes vx/<effort>/<n>-<name> and opens or updates one
  // pull request per part.
  rpc OpenShipment(OpenShipmentRequest) returns (OpenShipmentResponse) {}
  rpc ListShipments(ListShipmentsRequest) returns (ListShipmentsResponse) {}
}

message ShipStep {
  Changeset changeset = 1;
  int32 files = 2; // files the step changes on the target
  bool skipped = 3; // the target already has this change
}

message ShipmentPlan {
  string target = 1;
  string target_git_sha = 2;
  string branch = 3;
  string title = 4;
  string body = 5;
  repeated ShipStep steps = 6;
  repeated Conflict conflicts = 7;
  string conflicted_change = 8; // change id where the replay stopped
  repeated Warning warnings = 9; // problems found in the shipped tree
  // A split: one pull request per group.
  string split = 10; // independent, stacked; empty: one pull request
  repeated ShipGroup groups = 11;
  bool suggested = 12; // vx chose the grouping
  repeated string problems = 13; // why the split cannot ship as grouped
  repeated string notes = 14;
  repeated Shipment stale = 15; // open parts of an earlier split this one leaves out
}

// ShipGroup is one part of a split: one branch and one pull request.
message ShipGroup {
  int32 part = 1; // 1-based
  string name = 2;
  string title = 3;
  string branch = 4; // vx/<effort>/<n>-<name>
  string base = 5; // the target, or the previous part's branch (stacked)
  repeated ShipStep steps = 6;
  repeated string files = 7;
  repeated string why = 8; // why these changes are together
  repeated Conflict conflicts = 9;
  string conflicted_change = 10;
  string problem = 11; // why the part cannot ship as grouped
  repeated Warning warnings = 12;
  string body = 13;
  string pr_number = 14; // of the shipment this part updates
  string url = 15;
}

// ShipGroupInput is one part of a person's grouping.
message ShipGroupInput {
  repeated string change_ids = 1; // ids or unique prefixes
}

message Shipment {
  string id = 1;
  string effort = 2;
  string title = 3;
  string branch = 4;
  string target = 5;
  string base_git_sha = 6;
  string head_git_sha = 7;
  string pr_number = 8;
  string url = 9;
  string state = 10; // open, draft, pushed, merged, closed
  repeated string change_ids = 11;
  string updated_at = 12;
  string split = 13; // independent, stacked; empty: one pull request
  int32 part = 14; // 1-based part of a split; 0: one pull request
  string ci_state = 15; // CI of the head commit: "", pending, passed, failed (v0.4)
  string ci_sha = 16; // the commit ci_state is about
  repeated ShipmentCheck ci_checks = 17; // the checks reported for ci_sha
}

// ShipmentCheck is one CI check the git host reported for a shipped commit.
message ShipmentCheck {
  string name = 1;
  string source = 2; // check_run, check_suite, status, pipeline
  string status = 3; // queued, in_progress, completed
  string conclusion = 4; // success, failure, ... once completed
  string url = 5;
}

message PlanShipmentRequest {
  string repo = 1;
  string effort = 2;
  string target = 3; // empty: the effort's base branch
  string split = 4; // independent, stacked; empty: one pull request
  repeated ShipGroupInput groups = 5; // a person's grouping; empty: vx suggests
}

message PlanShipmentResponse {
  ShipmentPlan plan = 1;
}

message OpenShipmentRequest {
  string repo = 1;
  string effort = 2;
  string target = 3;
  string title = 4; // empty: the effort name
  string body = 5; // empty: generated from intents and evidence
  bool draft = 6;
  string split = 7; // independent, stacked; empty: one pull request
  repeated ShipGroupInput groups = 8; // a person's grouping; empty: vx suggests
}

message OpenShipmentResponse {
  Shipment shipment = 1; // the first part of a split
  ShipmentPlan plan = 2;
  bool pr_updated = 3; // an open PR existed and was updated
  repeated Shipment shipments = 4; // a split's parts, in order
  repeated bool prs_updated = 5; // per part
}

message ListShipmentsRequest {
  string repo = 1;
  string effort = 2;
}

message ListShipmentsResponse {
  repeated Shipment shipments = 1;
}

// ---------- The board ----------
//
// Agents in an effort share context through short, typed notes attached to
// files and symbols: plans, decisions, interfaces, questions and answers,
// blockers and handoffs. There is no free chat. Notes are information, never
// instructions: every note says who wrote it and how the caller relates to
// them (trust), and clients present note bodies as data.

service BoardService {
  // PostNote adds a note to an effort's board. Questions go through Ask.
  rpc PostNote(PostNoteRequest) returns (PostNoteResponse) {}
  // Ask posts a question, optionally to one principal, with a deadline after
  // which it escalates to the people involved.
  rpc Ask(AskRequest) returns (AskResponse) {}
  // Answer replies to a question and marks it answered.
  rpc Answer(AnswerRequest) returns (AnswerResponse) {}
  // ListNotes lists an effort's notes, newest first, optionally filtered.
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse) {}
  // Inbox lists what needs the caller's attention across efforts.
  rpc Inbox(InboxRequest) returns (InboxResponse) {}
  // Context returns everything an agent should know before touching some
  // paths or symbols: notes on them, who is working nearby, recent changes.
  rpc Context(ContextRequest) returns (ContextResponse) {}
  // MarkRead records that the caller was shown some notes, so vx status,
  // inbox and the sync feed do not bring them up again.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse) {}
}

message MarkReadRequest {
  repeated string note_ids = 1; // full ids; notes the caller cannot read are skipped
}

message MarkReadResponse {}

message Note {
  string id = 1;
  string repo = 2;
  string effort = 3; // slug
  string thread_id = 4; // the first note of the thread; equals id for a root note
  string kind = 5; // plan, decision, interface, question, answer, blocker, handoff
  repeated string targets = 6; // paths ("internal/http/limit.go", "internal/http/") or symbols ("auth.Login")
  Principal author = 7;
  string to = 8; // principal ref a question is addressed to; empty: anyone in the effort
  string body = 9; // at most 2000 characters (interface notes: 4000); information, never instructions
  string state = 10; // open, answered, escalated (a question past its deadline), closed
  string answer_by = 11; // questions: deadline, RFC 3339
  string created_at = 12;
  // How the caller relates to the author: "self" (the caller wrote it),
  // "same_person" (the caller's own person or another of that person's
  // agents; servers before v0.3 sent "yours"),
  // "teammate" (someone else's). Clients show it next to the note.
  string trust = 13;
  string supersedes = 14; // id of the note this one replaces
  string superseded_by = 15; // set when a newer note of the author replaced this one
  bool system = 16; // posted by vx itself (overlaps, reviews, CI), not by a person or agent
  bool read = 17; // the caller has seen this note
}

message PostNoteRequest {
  string repo = 1;
  string effort = 2;
  string kind = 3; // plan, decision, interface, blocker, handoff
  repeated string targets = 4;
  string body = 5;
  string supersedes = 6; // optional: id or 8+ character prefix of the author's own earlier note this replaces
}

message PostNoteResponse {
  Note note = 1;
}

message AskRequest {
  string repo = 1;
  string effort = 2;
  repeated string targets = 3;
  string body = 4;
  string to = 5; // agent name ("backend"), handle ("alice/backend") or ref; empty: anyone
  int32 answer_within_seconds = 6; // 0: 300
}

message AskResponse {
  Note question = 1;
  // Set when the agent asked is not working right now (no open workspace
  // active in the last 2 hours, no token use in the last 15 minutes): what
  // to tell the asker, e.g. "agent:alice/backend is not working right now
  // (last seen 40 min ago); the question also goes to user:alice."
  string notice = 2;
  string to_last_seen = 3; // RFC 3339; empty: never seen (or the agent is working)
  string copied_to = 4; // the person the question was copied to at once (ref); empty: none
}

message AnswerRequest {
  string note_id = 1; // the question, or a full or 8+ character prefix of its id
  string body = 2;
}

message AnswerResponse {
  Note answer = 1;
  Note question = 2;
}

message ListNotesRequest {
  string repo = 1;
  string effort = 2;
  repeated string targets = 3; // match rules as in Context
  repeated string kinds = 4;
  string since = 5; // RFC 3339; empty: all
  string thread_id = 6;
  int32 limit = 7; // 0: 100
  bool include_superseded = 8; // keep notes a newer note replaced (default: left out)
}

message ListNotesResponse {
  repeated Note notes = 1;
}

message InboxRequest {}

message InboxResponse {
  repeated Note questions = 1; // open questions addressed to the caller (or, for people, to their agents)
  repeated Note answers = 2; // answers to questions the caller asked, newest first
  repeated Note escalated = 3; // people only: questions past their deadline in their efforts or to their agents
  // System notes addressed to the caller (people: also to their agents)
  // that no newer note replaced, newest first: review comments and CI
  // results from the git host (v0.4).
  repeated Note notes = 4;
  // People only: open questions to their agents that were not working when
  // asked, copied to them at once (not repeated in questions).
  repeated Note for_agents = 5;
}

message ContextRequest {
  string repo = 1;
  string effort = 2;
  // Paths or symbols. A note target T matches a requested P when T == P, or
  // one is a directory prefix of the other ("internal/http/" and
  // "internal/http/limit.go"), or a symbol prefix ("auth" and "auth.Login").
  repeated string targets = 3;
}

message ContextWorkspace {
  string owner = 1; // principal ref
  string intent = 2;
  string change_id = 3;
  string created_at = 4;
  // The workspace's changed files (or claim targets) among the targets
  // asked about; empty when it is not known to touch them. Context lists
  // these workspaces first.
  repeated string on_targets = 5;
  bool files_known = 6; // its working copy reported its changed files
}

message ContextResponse {
  repeated Note notes = 1; // matching notes, newest first
  repeated ContextWorkspace working = 2; // open workspaces in the effort
  repeated Changeset recent_changes = 3; // landed changes touching the targets, newest first, with files
  repeated Claim claims = 4; // active claims on the targets (all active claims when no targets)
  repeated OtherEffort other_efforts = 5; // the same targets in other open efforts of the repository the caller can read
  repeated Overlap overlaps = 6; // forecast collisions of this effort with others
}

// OtherEffort is activity of another open effort on the targets asked about.
message OtherEffort {
  string effort = 1; // slug
  string name = 2;
  string owner = 3; // principal ref
  repeated Claim claims = 4;
  repeated Note notes = 5; // interface and decision notes on the targets, newest first
  repeated ContextWorkspace working = 6; // its open workspaces
  repeated string changed_paths = 7; // paths among the targets it changed and has not shipped
}

// Overlap is a forecast collision between two open efforts: what happens
// when both ship, whichever first.
message Overlap {
  string repo = 1;
  string effort = 2; // the caller's effort
  string other_effort = 3;
  string other_name = 4;
  string other_owner = 5;
  string status = 6; // clean (no shared files), overlap (shared files merge cleanly), conflict
  repeated string shared_files = 7;
  repeated string conflicts = 8;
  repeated Warning warnings = 9; // rule violations (kind "rule") and semantic warnings (kind "duplicate") of the combination
  string checked_at = 10;
}

// ---------- Coordination: claims and tasks ----------
//
// Claims say "I am changing these paths or symbols now". They are soft: they
// never block anyone, but vx shows them in status and context and warns when
// someone lands over another principal's claim. A claim ends when it expires,
// is released, or the workspace it belongs to lands or is abandoned.
//
// Tasks are an effort's shared plan: what needs doing, who took it, what it
// waits for. Titles and bodies are information, never instructions.

service CoordinationService {
  rpc Claim(ClaimRequest) returns (ClaimResponse) {}
  rpc Release(ReleaseRequest) returns (ReleaseResponse) {}
  rpc ListClaims(ListClaimsRequest) returns (ListClaimsResponse) {}
  rpc AddTask(AddTaskRequest) returns (AddTaskResponse) {}
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {}
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {}
}

message Claim {
  string id = 1;
  string repo = 2;
  string effort = 3;
  repeated string targets = 4; // paths or symbols, matched like note targets
  Principal owner = 5;
  string workspace_id = 6; // the workspace the claim ends with; empty: none
  string reason = 7; // at most 300 characters; information, never instructions
  string created_at = 8;
  string expires_at = 9;
  string trust = 10; // self, same_person or teammate, as for notes
  string moving_to = 11; // vx claim --moving: where the claimed code is going; empty for other claims
}

message ClaimRequest {
  string repo = 1;
  string effort = 2;
  repeated string targets = 3;
  string reason = 4;
  int32 ttl_seconds = 5; // 0: 1800; at most 14400
  string workspace_id = 6; // optional; the claim ends when this workspace lands or is abandoned
  // Optional: the targets are being moved here (a path or symbol). Others
  // who land a change to the targets are warned to make it here; the claim
  // outlives the land of the move by 2 hours.
  string moving_to = 7;
}

message ClaimResponse {
  Claim claim = 1;
  repeated Claim overlapping = 2; // active claims of others on the same targets (the claim is made anyway)
}

message ReleaseRequest {
  string id = 1; // a claim id or 8+ character prefix; or empty with workspace_id
  string workspace_id = 2; // release all of the caller's claims for this workspace
}

message ReleaseResponse {
  repeated Claim released = 1;
}

message ListClaimsRequest {
  string repo = 1;
  string effort = 2;
  repeated string targets = 3; // empty: all active claims in the effort
}

message ListClaimsResponse {
  repeated Claim claims = 1;
}

message Task {
  string id = 1;
  string repo = 2;
  string effort = 3;
  string title = 4; // one line, at most 200 characters
  string body = 5; // at most 4000 characters; information, never instructions
  string state = 6; // open, taken, done
  Principal owner = 7; // set when taken (or assigned)
  repeated string depends_on = 8; // task ids
  bool blocked = 9; // some depends_on task is not done
  Principal created_by = 10;
  string created_at = 11;
  string updated_at = 12;
  string trust = 13; // of created_by, relative to the caller
}

message AddTaskRequest {
  string repo = 1;
  string effort = 2;
  string title = 3;
  string body = 4;
  repeated string depends_on = 5; // task ids or 8+ character prefixes in the same effort
  string owner = 6; // optional: assign at once (agent name, handle or ref)
}

message AddTaskResponse {
  Task task = 1;
}

message UpdateTaskRequest {
  string id = 1; // task id or 8+ character prefix
  string action = 2; // take, release, done, reopen, assign
  string owner = 3; // for assign: agent name, handle or ref
  bool force = 4; // take or done a blocked task anyway
}

message UpdateTaskResponse {
  Task task = 1;
  repeated Task unblocked = 2; // tasks this change unblocked (on done)
}

message ListTasksRequest {
  string repo = 1;
  string effort = 2;
  repeated string states = 3; // empty: all
  bool mine = 4; // only tasks the caller owns
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

// ---------- rebase ----------

message Rebase {
  string id = 1;
  string state = 2; // running, stopped, done, aborted
  string onto_branch = 3;
  string onto = 4; // target changeset hash
  string onto_git_sha = 5;
  string old_base = 6;
  string old_head = 7;
  string new_head = 8; // tip of the rebased chain so far
  int32 replayed = 9; // changes replayed so far
  int32 pending = 10; // changes still to replay, the stopped one included
  string started_by = 11;
  string updated_by = 12;
  string created_at = 13;
  string updated_at = 14;
  // When stopped: the change whose replay conflicts, its conflicts, and the
  // three trees whose merge with conflict markers reproduces them.
  Changeset stopped_at = 15;
  repeated RebaseConflict conflicts = 16;
  string base_tree = 17; // the stopped change's parent tree
  string change_tree = 18; // the stopped change's tree
  string onto_tree = 19; // the rebased chain so far
}

message RebaseConflict {
  string path = 1;
  string kind = 2;
  string detail = 3;
  // The file says "// Code generated ... DO NOT EDIT.": regenerate it
  // instead of editing conflict markers.
  bool generated = 4;
}

message RebaseEffortRequest {
  string repo = 1;
  string effort = 2;
  string onto = 3; // branch; empty: the effort's base branch
}

message RebaseEffortResponse {
  Rebase rebase = 1; // empty when up_to_date
  Effort effort = 2;
  bool up_to_date = 3; // the effort already sits on the branch head
}

message ContinueRebaseRequest {
  string repo = 1;
  string effort = 2;
  string stopped_at = 3; // hash of the change that was resolved (Rebase.stopped_at.hash)
  string tree = 4; // resolved tree on top of Rebase.onto_tree; objects must be uploaded
}

message ContinueRebaseResponse {
  Rebase rebase = 1;
  Effort effort = 2;
}

message AbortRebaseRequest {
  string repo = 1;
  string effort = 2;
}

message AbortRebaseResponse {
  Rebase rebase = 1;
  Effort effort = 2;
}

message GetRebaseRequest {
  string repo = 1;
  string effort = 2;
}

message GetRebaseResponse {
  Rebase rebase = 1; // empty if the effort was never rebased
}

// ---------- Organizations, teams and repository roles ----------
//
// Organizations own repositories. People are members of organizations with a
// role (owner, admin, member) and may be in teams. Repository roles (read,
// write, admin) are granted to people or teams; an organization's members
// also get its default repository role. Owners and admins of an organization
// are admins of all its repositories. Agents have exactly the access of the
// person they act for. Superadmins run the server: they manage people and
// see every organization, but have no role on any repository unless its
// admins grant one (support access: GrantSupport, time-limited).
// A repository the caller cannot read behaves as if it did not exist.

service OrgService {
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse) {}
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse) {}
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse) {}
  rpc UpdateOrg(UpdateOrgRequest) returns (UpdateOrgResponse) {}
  // Deleting an organization (owners, never agents; not personal ones): it
  // is hidden at once (its repositories are not found, it leaves every
  // list, its handle stays reserved), owners restore it until the grace
  // period ends, then the server purges it. The deletion record names no
  // repository: owners read it until the purge.
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse) {}
  rpc RestoreOrg(RestoreOrgRequest) returns (RestoreOrgResponse) {}
  rpc GetOrgDeletion(GetOrgDeletionRequest) returns (GetOrgDeletionResponse) {}
  rpc ListDeletedOrgs(ListDeletedOrgsRequest) returns (ListDeletedOrgsResponse) {}
  rpc SetMember(SetMemberRequest) returns (SetMemberResponse) {}
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {}
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse) {}
  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse) {}
  rpc SetTeamMember(SetTeamMemberRequest) returns (SetTeamMemberResponse) {}
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse) {}
  rpc GrantRepo(GrantRepoRequest) returns (GrantRepoResponse) {}
  rpc RevokeRepo(RevokeRepoRequest) returns (RevokeRepoResponse) {}
  rpc RepoAccess(RepoAccessRequest) returns (RepoAccessResponse) {}
  // Support access (repository admins): give a superadmin read or write on
  // one repository until a time, at most 30 days ahead; recorded in the
  // operation log. The superadmin may also end their own early.
  rpc GrantSupport(GrantSupportRequest) returns (GrantSupportResponse) {}
  rpc RevokeSupport(RevokeSupportRequest) returns (RevokeSupportResponse) {}
  rpc ListSupport(ListSupportRequest) returns (ListSupportResponse) {}
  // People (superadmins): create people and list everyone on the server.
  rpc CreatePerson(CreatePersonRequest) returns (CreatePersonResponse) {}
  rpc ListPeople(ListPeopleRequest) returns (ListPeopleResponse) {}
  // The data processing agreement (servers with VX_REQUIRE_DPA): an
  // organization's status, every acceptance and, on request, a version's
  // text (members and superadmins). Accepting is not in the API: an owner
  // accepts in the web UI, as a deliberate act by a person.
  rpc GetOrgAgreement(GetOrgAgreementRequest) returns (GetOrgAgreementResponse) {}
}

message AgreementVersion {
  string id = 1;
  string title = 2;
  string published = 3; // RFC 3339
  string effective = 4; // RFC 3339
  string sha256 = 5; // of the Markdown text, hex
}

message AgreementAcceptance {
  string id = 1;
  string version = 2;
  string sha256 = 3; // of the text as accepted
  string accepted_by = 4; // ref of the person
  string accepted_at = 5;
  string ip = 6;
  bool known = 7; // the server still publishes this version
}

message GetOrgAgreementRequest {
  string org = 1;
  // text: return the text of version (empty: the one in effect); with
  // acceptance set, the text exactly as that acceptance accepted it.
  bool text = 2;
  string version = 3;
  string acceptance = 4;
}
message GetOrgAgreementResponse {
  bool required = 1; // false: this server does not ask for an agreement
  AgreementVersion current = 2; // in effect now
  AgreementAcceptance current_accepted = 3; // unset while it is missing
  bool usable = 4; // the organization may be used for work
  repeated AgreementVersion announced = 5; // published, not in effect yet
  repeated string announced_accepted = 6; // ids of announced versions already accepted
  AgreementVersion pending = 7; // what an owner accepts next
  string missing = 8; // why work is refused, while it is
  repeated AgreementAcceptance history = 9; // newest first
  string owners = 10;
  bool can_accept = 11; // the caller is a person who owns the organization
  string accept_url = 12;
  bytes text = 13; // with text set: the Markdown
  AgreementVersion text_version = 14; // which version text is
}

message Org {
  string handle = 1; // lowercase, like a person's handle
  string display_name = 2;
  string default_repo_role = 3; // none, read or write: what every member gets on the org's repositories
  string created_at = 4;
  string my_role = 5; // owner, admin, member, or empty for superadmins who are not members
  bool personal = 6; // a person's own organization, named like them
}

message OrgMember {
  Principal person = 1;
  string role = 2; // owner, admin, member
  repeated string teams = 3;
}

message Team {
  string org = 1;
  string name = 2; // lowercase
  repeated Principal members = 3;
}

message RepoGrant {
  string repo = 1;
  string subject = 2; // "user:alice" or "team:acme/backend"
  string role = 3; // read, write, admin
}

message RepoAccessEntry {
  Principal person = 1;
  string role = 2; // effective role
  repeated string via = 3; // how: "org owner", "org default", "user:alice", "team:acme/backend"
}

message CreateOrgRequest {
  string handle = 1;
  string display_name = 2;
}
message CreateOrgResponse { Org org = 1; }

message ListOrgsRequest {
  bool all = 1; // superadmins: every organization
}
message ListOrgsResponse { repeated Org orgs = 1; }

message GetOrgRequest { string handle = 1; }
message GetOrgResponse {
  Org org = 1;
  repeated OrgMember members = 2;
  repeated Team teams = 3;
  repeated Repo repos = 4; // the org's repositories the caller can read
}

message UpdateOrgRequest {
  string handle = 1;
  string display_name = 2; // empty: unchanged
  string default_repo_role = 3; // empty: unchanged
}
message UpdateOrgResponse { Org org = 1; }

// OrgDeletion is the record of an organization's deletion.
message OrgDeletion {
  string org = 1; // handle
  string org_id = 2;
  string requested_by = 3; // principal ref
  string deleted_at = 4;
  string purge_after = 5; // when the grace period ends and the purge runs
  string purge_started = 6; // empty until the purge began; no restore after
  string purged_at = 7; // empty until purged
  map<string, int64> counts = 8; // what the purge removed, by kind
  string confirmation = 9; // the deletion confirmation as plain text
}

message DeleteOrgRequest {
  string handle = 1;
  string confirm = 2; // the handle again
}
message DeleteOrgResponse { OrgDeletion deletion = 1; }

message RestoreOrgRequest { string handle = 1; }
message RestoreOrgResponse { Org org = 1; }

message GetOrgDeletionRequest { string handle = 1; }
message GetOrgDeletionResponse { OrgDeletion deletion = 1; }

message ListDeletedOrgsRequest {}
message ListDeletedOrgsResponse { repeated OrgDeletion deletions = 1; } // deleted organizations you own, not purged yet

message SetMemberRequest {
  string org = 1;
  string person = 2; // handle or ref of a person
  string role = 3; // owner, admin, member
}
message SetMemberResponse { OrgMember member = 1; }

message RemoveMemberRequest {
  string org = 1;
  string person = 2;
}
message RemoveMemberResponse {}

message CreateTeamRequest {
  string org = 1;
  string name = 2;
}
message CreateTeamResponse { Team team = 1; }

message DeleteTeamRequest {
  string org = 1;
  string name = 2;
}
message DeleteTeamResponse {}

message SetTeamMemberRequest {
  string org = 1;
  string team = 2;
  string person = 3;
}
message SetTeamMemberResponse { Team team = 1; }

message RemoveTeamMemberRequest {
  string org = 1;
  string team = 2;
  string person = 3;
}
message RemoveTeamMemberResponse { Team team = 1; }

message GrantRepoRequest {
  string repo = 1;
  string subject = 2; // "user:alice", "alice", or "team:acme/backend"
  string role = 3; // read, write, admin
}
message GrantRepoResponse { RepoGrant grant = 1; }

message RevokeRepoRequest {
  string repo = 1;
  string subject = 2;
}
message RevokeRepoResponse {}

message RepoAccessRequest { string repo = 1; }
message RepoAccessResponse {
  repeated RepoGrant grants = 1; // direct grants
  repeated RepoAccessEntry people = 2; // everyone's effective role (repo admins only)
}

message SupportGrant {
  string repo = 1;
  Principal person = 2; // the superadmin
  string role = 3; // read or write
  string expires_at = 4;
  string reason = 5;
  string granted_by = 6; // ref of who granted it, empty when they are gone
  string created_at = 7;
}

message GrantSupportRequest {
  string repo = 1;
  string person = 2; // handle or user:HANDLE of a superadmin
  string role = 3; // read or write; empty: read
  int64 duration_seconds = 4; // 0: 24 hours; at most 30 days
  string reason = 5; // shown on the access page and in the operation log
}
message GrantSupportResponse { SupportGrant grant = 1; }

message RevokeSupportRequest {
  string repo = 1;
  string person = 2;
}
message RevokeSupportResponse {}

message ListSupportRequest { string repo = 1; }
message ListSupportResponse { repeated SupportGrant grants = 1; }

message CreatePersonRequest {
  string handle = 1;
  string display_name = 2;
  string email = 3;
  bool site_admin = 4;
  string org = 5; // optional: add as a member of this organization
}
message CreatePersonResponse {
  Principal person = 1;
  string token = 2; // shown once
}

message ListPeopleRequest {}
message ListPeopleResponse { repeated Principal people = 1; }

// ---------- Public: no token needed ----------
//
// The only RPCs that work without a token: what the server is, and the
// browser login of the CLI.

service PublicService {
  // ServerInfo tells clients the server version and the oldest CLI it works
  // with, so either side can say "update vx" instead of failing oddly.
  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse) {}
  // StartCLILogin begins a browser login: the CLI shows user_code and opens
  // verification_url; the person signs in and approves there.
  rpc StartCLILogin(StartCLILoginRequest) returns (StartCLILoginResponse) {}
  // PollCLILogin returns the token once the person approved (exactly once).
  rpc PollCLILogin(PollCLILoginRequest) returns (PollCLILoginResponse) {}
}

message ServerInfoRequest {
  string cli_version = 1; // the caller's version, for the server's log and answer
}

message ServerInfoResponse {
  string version = 1;
  string min_cli_version = 2; // older CLIs must update
  repeated string features = 3; // e.g. "board", "claims", "tasks", "rebase", "orgs", "github"
  bool github_sign_in = 4; // the server has a GitHub App configured
  string cli_status = 5; // ok, update_recommended, update_required
  string message = 6; // what to tell the person, when cli_status is not ok
}

message StartCLILoginRequest {
  string client_name = 1; // e.g. "vx on alice-laptop"
}

message StartCLILoginResponse {
  string device_code = 1; // secret: only the CLI knows it
  string user_code = 2; // shown to the person, confirmed in the browser
  string verification_url = 3; // opens the approval page with the code filled in
  string expires_at = 4;
  int32 interval_seconds = 5; // poll no faster than this
}

message PollCLILoginRequest {
  string device_code = 1;
}

message PollCLILoginResponse {
  string status = 1; // pending, approved, denied, expired
  string token = 2; // set once, when approved
  Principal principal = 3;
}

message ListOverlapsRequest {
  string repo = 1;
  string effort = 2; // empty: every pair in the repository the caller can read
}

message ListOverlapsResponse {
  repeated Overlap overlaps = 1;
}

// ---------- Repository rules (vx.toml) ----------
//
// vx.toml at the root of a repository declares what text merges cannot see:
//   [[unique]]    two files may not share a key (for example a migration number)
//   [[generated]] files never text-merged; the command regenerates them
//   [checks]      the commands that make evidence "verified" here

service RulesService {
  // GetRules returns the rules at a ref (default: the effort head or the default branch).
  rpc GetRules(GetRulesRequest) returns (GetRulesResponse) {}
  // Reserve hands out the next free value of a [[unique]] rule, across the
  // target branch, every open effort and earlier reservations.
  rpc Reserve(ReserveRequest) returns (ReserveResponse) {}
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse) {}
}

message UniqueRule {
  string name = 1; // e.g. "migration"
  string glob = 2; // e.g. "internal/store/migrations/*.sql"
  string key = 3; // regular expression; its first group is the key, e.g. "^(\\d+)_"
  // Instead of key: a regular expression matched against each line of the
  // files; its first group may not be used twice (within a scope).
  string content = 4;
  string scope = 5; // with content: a regular expression whose first group names a scope, e.g. a proto message
}

message GeneratedRule {
  string glob = 1; // e.g. "gen/**"
  string command = 2; // e.g. "buf generate"
}

message RepoRules {
  repeated UniqueRule unique = 1;
  repeated GeneratedRule generated = 2;
  repeated string required_checks = 3;
  string source = 4; // where they came from, e.g. "vx.toml at 3f2a1c9d0e7b"; empty: no vx.toml
  repeated LandingPolicy policies = 5;
  // What of vx.toml this server does not know (keys or tables of a newer
  // vx), left out: a rule with an unknown key is ignored as a whole.
  repeated string ignored = 6;
}

// LandingPolicy is a [[policy]] of vx.toml: how changes to its paths land.
message LandingPolicy {
  repeated string paths = 1; // globs
  string mode = 2; // fast, gated or human
  repeated string require = 3; // checks a gated or human land needs, run by vx and passing
  repeated string approvers = 4; // human: "user:HANDLE" or "team:ORG/TEAM"; empty: anyone with write
  int32 line = 5; // line in vx.toml
}

message GetRulesRequest {
  string repo = 1;
  string effort = 2; // optional
}

message GetRulesResponse {
  RepoRules rules = 1;
}

message ReserveRequest {
  string repo = 1;
  string effort = 2;
  string rule = 3; // a [[unique]] rule's name
}

message ReserveResponse {
  string value = 1; // e.g. "016", in the format of the existing keys
  string example = 2; // e.g. "internal/store/migrations/016_<name>.sql"
}

message ListReservationsRequest {
  string repo = 1;
  string rule = 2; // optional
}

message Reservation {
  string rule = 1;
  string value = 2;
  string effort = 3;
  string reserved_by = 4;
  string created_at = 5;
}

message ListReservationsResponse {
  repeated Reservation reservations = 1;
}

message CloseEffortRequest {
  string repo = 1;
  string effort = 2;
  string state = 3; // merged or abandoned
}

message CloseEffortResponse {
  Effort effort = 1;
}

// ---------- Reviews (landing policies) ----------
//
// A land that changes a file under a "human" [[policy]] of vx.toml waits
// for a person: it is stored as a pending review and the effort head does
// not move. People with write on the repository (and in the policy's
// approvers, when it names them) approve it, which lands it with the
// normal merge, or reject it with a reason. Agents never decide reviews.

service ReviewService {
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse) {}
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse) {}
  // ApproveReview lands the change onto the current effort head. When it
  // conflicts, the review stays pending and goes back to the author.
  rpc ApproveReview(ApproveReviewRequest) returns (ApproveReviewResponse) {}
  rpc RejectReview(RejectReviewRequest) returns (RejectReviewResponse) {}
}

message ApproverList {
  repeated string approvers = 1; // "user:HANDLE" or "team:ORG/TEAM"
}

message Review {
  string id = 1;
  string repo = 2;
  string effort = 3; // slug
  string workspace_id = 4;
  string change_id = 5;
  string intent = 6;
  Principal author = 7;
  string base = 8; // changeset the snapshot was made on
  string tree = 9; // the author's snapshot
  Evidence evidence = 10;
  repeated string paths = 11; // changed files under the human policy
  repeated string policies = 12; // the matching [[policy]] tables, e.g. [[policy]] paths = ["db/**"] (vx.toml line 9)
  repeated ApproverList approvers = 13; // a person must be in every list; empty: anyone with write
  string state = 14; // pending, approved, rejected, withdrawn
  repeated string conflicts = 15; // pending: paths that conflicted when it was last approved
  Principal decided_by = 16;
  string decided_at = 17;
  string reason = 18; // why it was rejected
  string landed = 19; // the changeset an approval landed
  string created_at = 20;
  string updated_at = 21;
  repeated FileChange files = 22; // GetReview only
  bool can_decide = 23; // the caller may approve or reject it
  string cannot_decide = 24; // why not, when can_decide is false and it is pending
  string waiting = 25; // "Waiting for a person to review: PATHS (policy in vx.toml)"
}

message ListReviewsRequest {
  string repo = 1; // empty: every repository the caller can read
  string effort = 2; // needs repo
  repeated string states = 3; // empty: pending
  int32 limit = 4;
}

message ListReviewsResponse {
  repeated Review reviews = 1;
}

message GetReviewRequest {
  string id = 1; // id or a prefix of at least 8 characters
}

message GetReviewResponse {
  Review review = 1;
}

message ApproveReviewRequest {
  string id = 1;
}

message ApproveReviewResponse {
  Review review = 1;
  LandResponse land = 2; // set when the approval landed the change
  repeated Conflict conflicts = 3; // set when it conflicts: the review stays pending
}

message RejectReviewRequest {
  string id = 1;
  string reason = 2; // required; the author reads it
}

message RejectReviewResponse {
  Review review = 1;
}
