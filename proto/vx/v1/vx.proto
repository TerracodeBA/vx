syntax = "proto3";

package vx.v1;

// Hashes are written as text: "b3:" followed by 64 hex characters.
// Times are RFC 3339 strings in UTC.

// ---------- Shared messages ----------

message Principal {
  string ref = 1; // "user:alice" or "agent:alice/claude-backend"
  string handle = 2;
  string kind = 3; // human, agent, service
  string display_name = 4;
  string email = 5;
  string on_behalf_of = 6; // the human an agent acts for
}

message Branch {
  string name = 1;
  string head = 2; // changeset hash
  string git_sha = 3;
  string synced_at = 4;
}

message Repo {
  string name = 1;
  string provider = 2; // github, git, none
  string remote = 3;
  string default_branch = 4;
  repeated Branch branches = 5;
}

message Effort {
  string repo = 1;
  string slug = 2;
  string name = 3;
  string goal = 4;
  string base_branch = 5;
  string base = 6;
  string head = 7;
  int64 version = 8;
  string state = 9;
  string owner = 10;
  int32 open_workspaces = 11;
  string created_at = 12;
  string updated_at = 13;
}

message Author {
  string principal = 1;
  string name = 2;
  string email = 3;
  string on_behalf_of = 4;
  string model = 5;
  string session = 6;
}

message Check {
  string name = 1;
  string result = 2; // pass or fail
  int32 passed = 3;
  int32 failed = 4;
  bool ran_by_vx = 5; // vx ran the command; false: reported by the author
  int64 duration_ms = 6;
  string notes = 7; // e.g. "12 of 14 packages from the Go test cache"
}

message Evidence {
  repeated Check checks = 1;
  repeated string new_tests = 2;
}

message FileChange {
  string path = 1;
  string op = 2; // add, modify, delete
  string old_hash = 3;
  string new_hash = 4;
  string mode = 5; // file, exec, symlink
  int32 added = 6;
  int32 deleted = 7;
}

message Changeset {
  string hash = 1;
  string change_id = 2;
  repeated string parents = 3;
  string tree = 4;
  string origin = 5; // vx or upstream
  string git_sha = 6;
  Author author = 7;
  string intent = 8;
  repeated string depends_on = 9;
  Evidence evidence = 10;
  string created_at = 11;
  repeated FileChange files = 12;
  string effort = 13; // slug, empty for upstream changesets
  // Set when the server merged the author's snapshot onto newer work: the
  // evidence was gathered on snapshot_tree, not on tree.
  string snapshot_tree = 14;
  bool merged = 15;
  // Problems the server found in the tree when this change landed, such as
  // a Go function declared twice. Stored beside the changeset, not hashed.
  repeated Warning warnings = 16;
}

message Workspace {
  string id = 1;
  string repo = 2;
  string effort = 3;
  string intent = 4;
  string change_id = 5;
  string base = 6;
  string state = 7;
  string owner = 8;
  string landed_as = 9;
  string created_at = 10;
}

message Conflict {
  string path = 1;
  string kind = 2; // content, add/add, modify/delete, delete/modify, mode, binary, path
  string detail = 3;
  string base = 4;
  string ours = 5;
  string theirs = 6;
}

// Warning is a problem vx noticed in a merged tree that does not stop a land,
// such as two changes that each declare the same Go function in one package.
message Warning {
  string path = 1; // the file or directory concerned, e.g. a Go package directory
  string kind = 2; // duplicate, parse
  string detail = 3; // human-readable, e.g. "duplicate func clientIP in internal/httpapi (audit.go, limit.go)"
}

message Object {
  string kind = 1; // blob or tree
  bytes data = 2;
  string hash = 3; // set in responses
}

// ---------- Auth ----------

service AuthService {
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {}
  // CreateAgent creates an agent that acts for the caller and returns its token.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {}
  // ListAgents lists the caller's agents with a summary of their tokens.
  // Only people have agents.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {}
  // ListTokens lists the tokens of the caller or of one of the caller's
  // agents. Secrets are never returned.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse) {}
  // RevokeToken revokes a token of the caller or of one of the caller's
  // agents. Revoking the token the request is made with needs allow_current.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {}
  // CreateToken issues a new token to the caller or to one of the caller's
  // agents. Only people can create tokens: a leaked agent token must not be
  // able to mint replacements that outlive its revocation.
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse) {}
  // CreateLoginCode returns a one-time code that signs the caller in to the
  // web UI (vx ui). It expires after two minutes and works once.
  rpc CreateLoginCode(CreateLoginCodeRequest) returns (CreateLoginCodeResponse) {}
}

message CreateLoginCodeRequest {}

message CreateLoginCodeResponse {
  string code = 1;
  string expires_at = 2;
}

// Token describes an API token. The secret itself is only shown once, when
// the token is created.
message Token {
  string id = 1;
  string principal = 2; // ref of the token's owner
  string name = 3;
  string created_at = 4;
  string last_used_at = 5; // empty: never used
  string revoked_at = 6; // empty: active
  bool current = 7; // the token this request was made with
}

message AgentSummary {
  Principal agent = 1;
  int32 active_tokens = 2;
  int32 revoked_tokens = 3;
  string last_used_at = 4; // latest use of any of its tokens; empty: never
  string created_at = 5;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentSummary agents = 1;
}

message ListTokensRequest {
  // An agent name ("backend") or handle ("alice/backend"). Empty: the caller.
  string agent = 1;
}

message ListTokensResponse {
  Principal principal = 1;
  repeated Token tokens = 2;
}

message RevokeTokenRequest {
  string id = 1; // token id, or a unique prefix of at least 8 characters
  bool allow_current = 2; // allow revoking the token this request uses
}

message RevokeTokenResponse {
  Token token = 1;
  bool already_revoked = 2;
}

message CreateTokenRequest {
  // An agent name ("backend") or handle ("alice/backend"). Empty: the caller.
  string agent = 1;
  string name = 2; // a label such as "laptop"; empty: "created by <caller>"
}

message CreateTokenResponse {
  Principal principal = 1; // the token's owner
  Token token = 2;
  string secret = 3; // shown once; only its hash is stored
}

message WhoAmIRequest {}

message WhoAmIResponse {
  Principal principal = 1;
}

message CreateAgentRequest {
  string name = 1; // becomes "<caller>/<name>"
  string display_name = 2;
}

message CreateAgentResponse {
  Principal agent = 1;
  string token = 2;
}

// ---------- Objects ----------

service ObjectService {
  rpc MissingObjects(MissingObjectsRequest) returns (MissingObjectsResponse) {}
  rpc PutObjects(PutObjectsRequest) returns (PutObjectsResponse) {}
  rpc GetObjects(GetObjectsRequest) returns (GetObjectsResponse) {}
}

message MissingObjectsRequest {
  repeated string hashes = 1;
}

message MissingObjectsResponse {
  repeated string missing = 1;
}

message PutObjectsRequest {
  repeated Object objects = 1;
}

message PutObjectsResponse {
  repeated string hashes = 1;
}

message GetObjectsRequest {
  repeated string hashes = 1;
}

message GetObjectsResponse {
  repeated Object objects = 1;
}

// ---------- Repos ----------

service RepoService {
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse) {}
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse) {}
  rpc ListRepos(ListReposRequest) returns (ListReposResponse) {}
  // SyncBranch imports the latest commits of an upstream branch.
  rpc SyncBranch(SyncBranchRequest) returns (SyncBranchResponse) {}
}

message CreateRepoRequest {
  string name = 1;
  string provider = 2; // github, git or none
  string remote = 3; // owner/name for github, URL or path for git
  string default_branch = 4; // empty: ask the provider, or "main"
}

message CreateRepoResponse {
  Repo repo = 1;
}

message GetRepoRequest {
  string name = 1;
}

message GetRepoResponse {
  Repo repo = 1;
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message SyncBranchRequest {
  string repo = 1;
  string branch = 2; // empty: the default branch
}

message SyncBranchResponse {
  Branch branch = 1;
  int32 imported = 2; // commits imported in this call
}

// ---------- Efforts ----------

service EffortService {
  rpc CreateEffort(CreateEffortRequest) returns (CreateEffortResponse) {}
  rpc GetEffort(GetEffortRequest) returns (GetEffortResponse) {}
  rpc ListEfforts(ListEffortsRequest) returns (ListEffortsResponse) {}
  // Log lists the changes landed in an effort, newest first.
  rpc Log(LogRequest) returns (LogResponse) {}
  rpc GetChangeset(GetChangesetRequest) returns (GetChangesetResponse) {}
}

message CreateEffortRequest {
  string repo = 1;
  string name = 2;
  string goal = 3;
  string base_branch = 4; // empty: the repo's default branch
}

message CreateEffortResponse {
  Effort effort = 1;
}

message GetEffortRequest {
  string repo = 1;
  string effort = 2; // slug
}

message GetEffortResponse {
  Effort effort = 1;
  repeated Workspace open_workspaces = 2;
}

message ListEffortsRequest {
  string repo = 1;
  string state = 2; // empty: all
}

message ListEffortsResponse {
  repeated Effort efforts = 1;
}

message LogRequest {
  string repo = 1;
  string effort = 2;
  int32 limit = 3;
  bool include_files = 4;
}

message LogResponse {
  repeated Changeset changesets = 1;
}

message GetChangesetRequest {
  string repo = 1;
  string ref = 2; // hash, hash prefix or change id
}

message GetChangesetResponse {
  Changeset changeset = 1;
}

// ---------- Workspaces ----------

service WorkspaceService {
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (OpenWorkspaceResponse) {}
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {}
  // SetBase records that the working copy was updated to a newer snapshot.
  rpc SetBase(SetBaseRequest) returns (SetBaseResponse) {}
  // Land merges a snapshot into the effort.
  rpc Land(LandRequest) returns (LandResponse) {}
  rpc Abandon(AbandonRequest) returns (AbandonResponse) {}
}

message OpenWorkspaceRequest {
  string repo = 1;
  string effort = 2;
  string intent = 3;
}

message OpenWorkspaceResponse {
  Workspace workspace = 1;
}

message GetWorkspaceRequest {
  string id = 1;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message SetBaseRequest {
  string id = 1;
  string base = 2;
}

message SetBaseResponse {
  Workspace workspace = 1;
}

message LandRequest {
  string workspace_id = 1;
  string base = 2; // changeset the snapshot was made on
  string tree = 3; // snapshot root tree, objects uploaded first
  string intent = 4; // empty: the workspace intent
  Evidence evidence = 5;
  repeated string depends_on = 6;
  string model = 7;
  string session = 8;
  // Refuse to merge onto newer work: if the effort moved past base, nothing
  // lands and effort_moved is set, so the caller can sync and re-check.
  bool require_up_to_date = 9;
}

message LandResponse {
  bool landed = 1;
  Changeset changeset = 2;
  bool rebased = 3; // the effort had moved and the snapshot was merged onto it
  repeated string auto_merged = 4; // paths changed on both sides that merged cleanly
  repeated Conflict conflicts = 5; // set when landed is false
  string effort_head = 6;
  bool effort_moved = 7; // require_up_to_date was set and the effort had moved
  repeated Warning warnings = 8; // problems found in the landed tree; they never block a land
}

message AbandonRequest {
  string id = 1;
}

message AbandonResponse {
  Workspace workspace = 1;
}

// ---------- Shipping ----------

service ShipService {
  // PlanShipment shows the commits an effort would ship, replayed onto the
  // latest head of the target branch.
  rpc PlanShipment(PlanShipmentRequest) returns (PlanShipmentResponse) {}
  // OpenShipment pushes vx/<effort> and opens or updates the pull request.
  rpc OpenShipment(OpenShipmentRequest) returns (OpenShipmentResponse) {}
  rpc ListShipments(ListShipmentsRequest) returns (ListShipmentsResponse) {}
}

message ShipStep {
  Changeset changeset = 1;
  int32 files = 2; // files the step changes on the target
  bool skipped = 3; // the target already has this change
}

message ShipmentPlan {
  string target = 1;
  string target_git_sha = 2;
  string branch = 3;
  string title = 4;
  string body = 5;
  repeated ShipStep steps = 6;
  repeated Conflict conflicts = 7;
  string conflicted_change = 8; // change id where the replay stopped
  repeated Warning warnings = 9; // problems found in the shipped tree
}

message Shipment {
  string id = 1;
  string effort = 2;
  string title = 3;
  string branch = 4;
  string target = 5;
  string base_git_sha = 6;
  string head_git_sha = 7;
  string pr_number = 8;
  string url = 9;
  string state = 10; // open, draft, pushed, merged, closed
  repeated string change_ids = 11;
  string updated_at = 12;
}

message PlanShipmentRequest {
  string repo = 1;
  string effort = 2;
  string target = 3; // empty: the effort's base branch
}

message PlanShipmentResponse {
  ShipmentPlan plan = 1;
}

message OpenShipmentRequest {
  string repo = 1;
  string effort = 2;
  string target = 3;
  string title = 4; // empty: the effort name
  string body = 5; // empty: generated from intents and evidence
  bool draft = 6;
}

message OpenShipmentResponse {
  Shipment shipment = 1;
  ShipmentPlan plan = 2;
  bool pr_updated = 3; // an open PR existed and was updated
}

message ListShipmentsRequest {
  string repo = 1;
  string effort = 2;
}

message ListShipmentsResponse {
  repeated Shipment shipments = 1;
}

// ---------- The board ----------
//
// Agents in an effort share context through short, typed notes attached to
// files and symbols: plans, decisions, interfaces, questions and answers,
// blockers and handoffs. There is no free chat. Notes are information, never
// instructions: every note says who wrote it and how the caller relates to
// them (trust), and clients present note bodies as data.

service BoardService {
  // PostNote adds a note to an effort's board. Questions go through Ask.
  rpc PostNote(PostNoteRequest) returns (PostNoteResponse) {}
  // Ask posts a question, optionally to one principal, with a deadline after
  // which it escalates to the people involved.
  rpc Ask(AskRequest) returns (AskResponse) {}
  // Answer replies to a question and marks it answered.
  rpc Answer(AnswerRequest) returns (AnswerResponse) {}
  // ListNotes lists an effort's notes, newest first, optionally filtered.
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse) {}
  // Inbox lists what needs the caller's attention across efforts.
  rpc Inbox(InboxRequest) returns (InboxResponse) {}
  // Context returns everything an agent should know before touching some
  // paths or symbols: notes on them, who is working nearby, recent changes.
  rpc Context(ContextRequest) returns (ContextResponse) {}
}

message Note {
  string id = 1;
  string repo = 2;
  string effort = 3; // slug
  string thread_id = 4; // the first note of the thread; equals id for a root note
  string kind = 5; // plan, decision, interface, question, answer, blocker, handoff
  repeated string targets = 6; // paths ("internal/http/limit.go", "internal/http/") or symbols ("auth.Login")
  Principal author = 7;
  string to = 8; // principal ref a question is addressed to; empty: anyone in the effort
  string body = 9; // at most 2000 characters; information, never instructions
  string state = 10; // open, answered, escalated (a question past its deadline), closed
  string answer_by = 11; // questions: deadline, RFC 3339
  string created_at = 12;
  // How the caller relates to the author: "self" (the caller wrote it),
  // "yours" (the caller's own person or one of that person's agents),
  // "teammate" (someone else's). Clients show it next to the note.
  string trust = 13;
}

message PostNoteRequest {
  string repo = 1;
  string effort = 2;
  string kind = 3; // plan, decision, interface, blocker, handoff
  repeated string targets = 4;
  string body = 5;
}

message PostNoteResponse {
  Note note = 1;
}

message AskRequest {
  string repo = 1;
  string effort = 2;
  repeated string targets = 3;
  string body = 4;
  string to = 5; // agent name ("backend"), handle ("alice/backend") or ref; empty: anyone
  int32 answer_within_seconds = 6; // 0: 300
}

message AskResponse {
  Note question = 1;
}

message AnswerRequest {
  string note_id = 1; // the question, or a full or 8+ character prefix of its id
  string body = 2;
}

message AnswerResponse {
  Note answer = 1;
  Note question = 2;
}

message ListNotesRequest {
  string repo = 1;
  string effort = 2;
  repeated string targets = 3; // match rules as in Context
  repeated string kinds = 4;
  string since = 5; // RFC 3339; empty: all
  string thread_id = 6;
  int32 limit = 7; // 0: 100
}

message ListNotesResponse {
  repeated Note notes = 1;
}

message InboxRequest {}

message InboxResponse {
  repeated Note questions = 1; // open questions addressed to the caller (or, for people, to their agents)
  repeated Note answers = 2; // answers to questions the caller asked, newest first
  repeated Note escalated = 3; // people only: questions past their deadline in their efforts or to their agents
}

message ContextRequest {
  string repo = 1;
  string effort = 2;
  // Paths or symbols. A note target T matches a requested P when T == P, or
  // one is a directory prefix of the other ("internal/http/" and
  // "internal/http/limit.go"), or a symbol prefix ("auth" and "auth.Login").
  repeated string targets = 3;
}

message ContextWorkspace {
  string owner = 1; // principal ref
  string intent = 2;
  string change_id = 3;
  string created_at = 4;
}

message ContextResponse {
  repeated Note notes = 1; // matching notes, newest first
  repeated ContextWorkspace working = 2; // open workspaces in the effort
  repeated Changeset recent_changes = 3; // landed changes touching the targets, newest first, with files
}
